case_id: "gen-tree"
created_at: "2026-11-06T17:01:03+00:00"
updated_at: "2026-11-08T20:10:00+03:00"
research_question: "Восстановить родословную Миникаевых (Магнитогорск): от Миникаева А. А. через деда Фарита Салиховича и прадеда Салиха Хузнахметовича к прапрадеду Хузнахмету (1898) и месту происхождения рода; отдельно — материнская линия Абзалутдиновых и Гилемовых, родители бабушки Миникаевой М. М. (Ахметзяновы), род прабабушки Исламии (Шафигуллины из д. Средний Юрткуль) и род супруги по браку 20.08.2026"
subject_label: "Миникаев А. А. (2002)"
requested_output_language: "ru"

scope:
  target_relationship: "Миникаев А. А. → родители → четыре бабушки и деда → прадеды Салих (1926), Минимухамет (1924), Хузнахмет (1898), Ахнаф (1926), Махмут (1923) → прапрадеды Миникай, Габдул, Гилем, Заки, Фаруш; место происхождения рода Миникаевых в Татарстане; вторая ветка — род супруги, о предках которой данных по-прежнему нет"
  time_range: "1896–2026 гг."
  geographic_scope: ["г. Магнитогорск, Челябинская область", "г. Казань, Республика Татарстан", "Татарстан: Октябрьский (ныне Нурлатский) район, с. Фомкино — рабочая версия по индексам МВД РТ (дела 15358 и 15376)", "Татарстан: д. Средний Юрткуль (тат. Урта Йорткүл) Алькеевского, ныне Спасского района — родина прабабушки Исламии, раскулачена в 1931 г.", "Казанская губерния, Чистопольский уезд, Старо-Максимкинская волость — юрисдикция до 1920 г.", "Казанская губерния, Спасский уезд, Юрткульская волость — юрисдикция Среднего Юрткуля до 1920 г.", "Челябинская область — место спецпоселения обеих семей с 1931 г."]
