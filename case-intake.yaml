  living_people_data: "только фамилия с инициалами и год рождения"
  exclude_current_contacts_and_addresses: true
  sensitive_topics: ["живые лица: минимум данных", "репрессия: формулировать нейтрально, только по документу", "конфессия: по документам прихода, не по фамилии"]

known_constraints:
  - "До 08.11.2026 семейных документов не было; теперь есть один — справка о реабилитации Исламии (A-0052). Остальные сведения о семье — устные сообщения субъекта."
  - "Тождество с Миникаевыми из Фомкино подкреплено двумя цепочками (C-0025, C-0045, C-0046), но документ, называющий Фарита сыном Салиха, не получен — нужен дело № 15358."
  - "Родство внутри ветви Шафигуллиных не доказано: учёт спецпоселенцев не содержит отчеств и указаний на родство; связи P-0029–P-0037 — гипотезы до получения дела № 19371 (C-0084, C-0085, C-0086)."
  - "Справка A-0052 не называет ни отчества Исламии, ни имени её отца и матери; дата рождения в ней — только год, день и месяц дописаны от руки."
  - "Год рождения главы семьи расходится: 04.01.1898 по семье, 1893 в индексе, 1903 в соседнем деле (C-0026, unresolved)."
  - "Браки Фарита Салиховича и Миникаевой М. М., Нурмухамета Минимухаметовича и Абзалутдиновой Р. А., Ахнафа и Зульхии, Махмута и Софьи, Салиха и Исламии не документированы; в древе они стоят как родительские пары."
  - "О супруге (P-0014) известны фамилия с инициалами, год рождения и дата брака; точные данные не сохраняются. Ветка её предков начинается с документов."
  - "Надписи Махмута, Софьи и Исламии читаются частично: день и месяц у Махмута, месяц смерти Софьи и отчество Исламии держатся только на словах семьи и отчасти на документе (C-0065, C-0066, C-0068)."
  - "Реестр захоронений zahoron.ru неполон и не является архивным источником (C-0076)."

working_hypotheses:
  - "Род Миникаевых происходит из с. Фомкино Октябрьского (Нурлатского) района ТАССР и был раскулачен в 1931 г. (C-0025, corroborated)."
  - "Салих Хузнахметович (1926–1997) — тот же человек, что Салих Хузиахметович (1926) из дела № 15358 (C-0045, corroborated)."
  - "Хузнахмет (1898) — тот же человек, что Хузиахмет (1893) из дела № 15358 (C-0046, corroborated; год — C-0026)."
  - "Фамилия Миникаев образована от личного имени Миникай (C-0022)."
  - "Зульхия Закиевна — мать Абзалутдиновой Р. А. (C-0044, подтверждено); её брак с Ахнафом — гипотеза (C-0055)."
  - "Зульхия Закиевна имела не менее пяти детей (C-0050); вероятный сын — Рашит Ахнафович (1960–2006), C-0074."
  - "Равид Салихович Миникаев — возможный брат Фарита (C-0048)."
  - "Отец супруги — Константин; его фамилия не установлена (C-0034)."
  - "Миникаева М. М. — дочь Махмута Фарушевича Ахметзянова и Софьи Гильмановны; её девичья фамилия установлена по отцу (C-0063, C-0064), но в деле не сохраняется."
  - "Дом Хузнахмета и Салиха в Фомкино после раскулачивания использовался как школа (C-0089, hypothesis; открытые источники называют только даты школы — 1924 и 1965)."
  - "Исламия Миникаева (1926–2013) — жена Салиха Хузнахметовича и вероятная мать Фарита (C-0067, C-0069)."
  - "Миндар Габдулович Абзалутдинов (1907–1990) — возможный брат Минимухамета (C-0073)."
  - "Гаяз Миникаевич (1908–1990) — возможный брат Хузнахмета: оба сыновья Миникая (C-0075)."
  - "Исламия (P-0025) — уроженка д. Средний Юрткуль Алькеевского района ТАССР, девичья фамилия Шафигуллина; выслана 09.06.1931 как член семьи раскулаченной (C-0079, C-0080, C-0081)."
  - "Шафигуллин Сайдрауф (1896–1972) — вероятный отец Исламии: он «кулак» по индексу МВД РТ, дело № 19371 общее с её карточкой (C-0085)."
  - "Шафигулла (1872) — вероятный отец Сайдрауфа и старший в высланной семье; от его имени образована фамилия (C-0086)."
  - "Миникаевы из Фомкино и Шафигуллины из Среднего Юрткуля — две разные раскулаченные семьи, встретившиеся в Магнитогорске (C-0084, C-0087)."
